# Merge into the private deployment Compose config; credentials stay in its env file.
services:
  music:
    extra_hosts:
      - host.docker.internal:host-gateway
    # LiveKit runs on the host; without this mapping transport cannot connect.
    volumes:
      - ${ROOMS_MUSIC_HISTORY_DIR:?Set a private history directory}:/state
    environment:
      ROOMS_MUSIC_HISTORY_FILE: /state/music-history.json
    # Provision the history directory as UID10001, mode0700; never mount account keys here.
    mem_limit: 1280m
    tmpfs:
      - /tmp:size=805306368,mode=1777
    # 2h sets: <=180MiB each; one source operation at a time,384MiB global cache.
  # Private YouTube player parser for the DJ source bridge (reached as http://music-cipher:8001/).
  music-cipher:
    # Pin by digest and bump it only after a real add-song check. This is upstream d6b70bac
    # (2026-11-24), which reads the YouTube players served since 2026-11-23; the August image
    # failed every song with `a.addOnDisposeCallback is not a function`.
    image: ghcr.io/kikkia/yt-cipher@sha256:c38409ee59153c9572b97e116b366f5193d0ae44a41ea6e15027ce0afcb10052
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    tmpfs:
      - /tmp:size=67108864,mode=1777
      # One ~3 MB player script is saved per YouTube player release (about one a day) and only
      # a restart removes old ones. 64 MB filled after five weeks, and every new player then
      # failed with ENOSPC, so adding songs stopped. 256 MB lasts about a year; the pages count
      # toward mem_limit only while used. Restart the service to clear it sooner.
      - /home/nonroot/.cache:size=268435456,mode=1777,uid=65532,gid=65532
    environment:
      MAX_THREADS: '1'
      PREPROCESSED_CACHE_SIZE: '3'
